name: fetch-wireguard

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download WireGuard installer + full MSI
        run: |
          curl -L -o wireguard-installer.exe https://download.wireguard.com/windows-client/wireguard-installer.exe
          python3 - <<'PY'
          import urllib.request, re, os, subprocess, sys
          base = "https://download.wireguard.com/windows-client/"
          try:
              html = urllib.request.urlopen(base, timeout=30).read().decode('utf-8', 'replace')
          except Exception as e:
              print("FETCH_FAIL", e); sys.exit(1)
          print("PAGE_LEN", len(html))
          print("PAGE_HEAD >>>")
          print(html[:2500])
          print("<<<")
          names = sorted(set(re.findall(r'WireGuard-[0-9A-Za-z_.-]+\.msi', html)))
          print("NAMES", names)
          if not names:
              print("NO_MSI_IN_PAGE"); sys.exit(1)
          msi = names[-1]
          print("PICK", base + msi)
          subprocess.run(["curl", "-L", "-o", msi, base + msi], check=True)
          print("DONE", msi, os.path.getsize(msi))
          PY

      - name: Commit back to repo
        run: |
          git config --global user.email "bot@actions"
          git config --global user.name "fetch-bot"
          git clone "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" repo
          cp wireguard-installer.exe repo/
          MSI=$(ls WireGuard-*.msi | head -n1)
          cp "$MSI" repo/
          cd repo
          git add wireguard-installer.exe "$MSI"
          git commit -m "vendor: wireguard full MSI ($MSI)"
          git push
