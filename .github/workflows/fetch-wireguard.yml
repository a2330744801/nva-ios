name: fetch-wireguard

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download WireGuard installer + full MSI (amd64)
        run: |
          curl -L -o wireguard-installer.exe https://download.wireguard.com/windows-client/wireguard-installer.exe
          MSI="wireguard-amd64-1.1.1.msi"
          curl -L -o "$MSI" "https://download.wireguard.com/windows-client/$MSI"
          ls -la wireguard-installer.exe "$MSI"
          sha256sum wireguard-installer.exe "$MSI"

      - name: Commit back to repo
        run: |
          git config --global user.email "bot@actions"
          git config --global user.name "fetch-bot"
          git clone "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" repo
          cp wireguard-installer.exe repo/
          MSI=$(ls wireguard-*.msi | head -n1)
          cp "$MSI" repo/
          cd repo
          git add wireguard-installer.exe "$MSI"
          git commit -m "vendor: wireguard full MSI ($MSI)"
          git push
